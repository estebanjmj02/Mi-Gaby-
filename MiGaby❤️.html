<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una invitación para mi Gabi</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#e4f3ff;--bg2:#bfe0fa;--ink:#16345a;--red:#e0243a;--red2:#ff5a6e;--card:#ffffff;--muted:#4d6d92;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#10243f;--bg2:#183a63;--ink:#eaf4ff;--card:#1b3a5f;--muted:#a9c8ea}}
:root[data-theme="dark"]{--bg1:#10243f;--bg2:#183a63;--ink:#eaf4ff;--card:#1b3a5f;--muted:#a9c8ea}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(170deg,var(--bg1),var(--bg2));background-attachment:fixed;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.wrap{width:100%;max-width:420px;padding:24px 20px;text-align:center}
h1,h2{font-family:Pacifico,cursive;font-weight:400;margin:0;color:var(--red)}
.hidden{display:none!important}
#gate p{font-size:1.15rem;margin:14px 0 6px}
#heart{background:none;border:0;cursor:pointer;width:min(46vw,190px);padding:0;margin:50px 0;transform:scale(var(--s,1));-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 10px 18px rgba(224,36,58,.35));transition:transform .3s;user-select:none;touch-action:manipulation}
#heart svg{display:block;width:100%;height:auto;overflow:visible}
#heart.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(calc(var(--s,1)*1.12))}}
.count{font-family:Pacifico,cursive;font-size:2rem;color:var(--red)}
.bar{height:10px;border-radius:99px;background:rgba(224,36,58,.18);overflow:hidden;margin:12px auto 0;max-width:260px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red2),var(--red));transition:width .2s}
.fly{position:fixed;pointer-events:none;font-size:22px;animation:fly 1.2s ease-out forwards;z-index:5}
@keyframes fly{to{transform:translate(var(--dx),-170px) scale(1.4);opacity:0}}
#card{background:var(--card);border-radius:28px;padding:14px 14px 26px;box-shadow:0 18px 50px rgba(22,52,90,.22);animation:rise .9s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
.photo{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 55%;border-radius:20px;border:4px solid var(--red);display:block}
#card h2{font-size:2.3rem;margin:20px 0 6px}
.msg{font-size:1.15rem;margin:0 14px 18px;line-height:1.45}
.info{display:flex;gap:10px;justify-content:center;margin:0 0 20px}
.info div{flex:1;border:2px solid var(--red);border-radius:16px;padding:10px 6px;font-weight:700}
.info small{display:block;color:var(--muted);font-weight:400}
.btn{display:block;width:100%;border:0;border-radius:99px;padding:15px;font:700 1.1rem Nunito,sans-serif;color:#fff;background:var(--red);cursor:pointer;text-decoration:none;box-shadow:0 8px 20px rgba(224,36,58,.35)}
.btn.alt{background:transparent;color:var(--red);border:2px solid var(--red);box-shadow:none;margin-top:10px}
.sign{font-family:Pacifico,cursive;color:var(--red);font-size:1.5rem;margin-top:22px}
#ok{margin-top:16px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <section id="gate">
    <h1>Mi Gabi, tengo algo para ti</h1>
    <p>Toca el corazón para abrirlo</p>

<script>
var N=24,c=0,heart=document.getElementById('heart');
function burst(x,y,e,k){for(var i=0;i<k;i++){var s=document.createElement('span');s.className='fly';s.textContent=e;s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',(Math.random()*160-80)+'px');document.body.appendChild(s);setTimeout(function(el){el.remove()}.bind(null,s),1300)}}
heart.addEventListener('click',function(ev){
  if(c>=N)return;c++;
  var p=c/N;document.getElementById('cp').setAttribute('y',92-92*p);heart.style.setProperty('--s',1+p*0.5);
  heart.classList.remove('pop');void heart.offsetWidth;heart.classList.add('pop');
  var r=heart.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/3,c%2?'❤️':'💙',2);
  if(c===N){setTimeout(function(){document.getElementById('gate').classList.add('hidden');document.getElementById('card').classList.remove('hidden');window.scrollTo(0,0);burst(innerWidth/2,innerHeight/2,'❤️',14)},450)}
});
document.getElementById('yes').addEventListener('click',function(){
  this.classList.add('hidden');document.getElementById('ok').classList.remove('hidden');document.getElementById('wa').classList.remove('hidden');
  for(var i=0;i<6;i++)setTimeout(function(){burst(Math.random()*innerWidth,innerHeight*0.8,Math.random()>.5?'❤️':'💙',3)},i*150);
});
